[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A command-line AI harness."
dependencies = [
    "openai",
    "google-genai",
    "httpx",
    "python-dotenv"
]
requires-python = ">=3.10"

[project.scripts]
harness = "harness.app.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]
namespaces = true
